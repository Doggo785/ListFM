name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: listfm
          POSTGRES_PASSWORD: listfm
          POSTGRES_DB: listfm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U listfm"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
        with:
          # diff-cover compares the PR diff against origin/dev: needs full history.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r backend/requirements.txt pytest pytest-asyncio
      - name: Run migrations
        env:
          DATABASE_URL: postgresql+asyncpg://listfm:listfm@localhost:5432/listfm_test
          LASTFM_API_KEY: test_key
          LASTFM_API_SECRET: test_secret
          JWT_SECRET: test_jwt_secret_for_ci_only_padded
        run: |
          source .venv/bin/activate
          cd backend && alembic upgrade head
      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql+asyncpg://listfm:listfm@localhost:5432/listfm_test
          TEST_DATABASE_URL: postgresql+asyncpg://listfm:listfm@localhost:5432/listfm_test
          LASTFM_API_KEY: test_key
          LASTFM_API_SECRET: test_secret
          JWT_SECRET: test_jwt_secret_for_ci_only_padded
        run: |
          source .venv/bin/activate
          python -m pytest backend/tests/ -q --cov=backend --cov-report=xml:coverage.xml
      - name: Diff coverage (changed lines >= 80%)
        run: |
          source .venv/bin/activate
          diff-cover coverage.xml --compare-branch=origin/dev --fail-under=80

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.16.8
      - name: Ruff check
        run: ruff check backend

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install mypy
        run: pip install mypy==2.3.1
      - name: Mypy check
        run: mypy backend --ignore-missing-imports

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Secret scan covers history: needs full history.
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Secret scan
        run: gitleaks detect --redact --no-banner --source .

  osv-scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install osv-scanner
        run: |
          curl -sSL https://github.com/google/osv-scanner/releases/download/v2.6.0/osv-scanner_linux_amd64 -o /tmp/osv-scanner
          chmod +x /tmp/osv-scanner
          sudo mv /tmp/osv-scanner /usr/local/bin/osv-scanner
      - name: Dependency vulnerability scan (fail on High/Critical only)
        # osv-scanner exits 1 on ANY finding, but CONSTRAINTS.md (W1) tolerates
        # Medium/Low: gate on numeric max_severity (CVSS >= 7.0 = High).
        run: |
          osv-scanner scan source -r . --format json --output /tmp/osv.json || true
          python3 - <<'EOF'
          import json, sys
          data = json.load(open('/tmp/osv.json'))
          bad = []
          for res in data.get('results', []):
              for pkg in res.get('packages', []):
                  p = pkg.get('package', {})
                  label = f"{p.get('name', '?')}@{p.get('version', '?')}"
                  for g in pkg.get('groups', []):
                      try:
                          sev = float(g.get('max_severity', 'nan'))
                      except (TypeError, ValueError):
                          print(f"no parseable severity for {label} {g.get('ids')}, failing safe")
                          sys.exit(1)
                      if sev >= 7.0:
                          bad.append(f"{g.get('ids')} {label} (max_severity={sev})")
          if bad:
              print('FAIL: High/Critical vulnerabilities found:')
              print('\n'.join(f'  - {b}' for b in bad))
              sys.exit(1)
          print('OK: no High/Critical vulnerabilities (Medium/Low tolerated, see W1).')
          EOF

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run check:fast
      - name: Build
        working-directory: frontend
        run: npm run build

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # diff-cover compares the PR diff against origin/dev: needs full history.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run tests with coverage
        working-directory: frontend
        run: npx vitest run --coverage --coverage.reporter=cobertura --coverage.reporter=text
      - name: Diff coverage (changed lines >= 80%)
        working-directory: frontend
        run: |
          pip install diff-cover==10.6.0
          diff-cover coverage/cobertura-coverage.xml --compare-branch=origin/dev --fail-under=80
